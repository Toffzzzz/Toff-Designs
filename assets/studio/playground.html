<!-- Sketch your site: the playground. Paste after What we build. -->
<section class="r3-section pg-section" id="playground" aria-labelledby="pg-title">
  <div class="r3-inner">
    <h2 class="r3-h2" id="pg-title">Try a look for your business</h2>
    <p class="r3-lede">Choose your kind of business, a style and a layout, and a site takes shape on the laptop and phone. If you like where it’s going, send it to us and we’ll start from there.</p>

    <div class="pg">
      <div class="pg-preview dv-tilt" data-brief="playground">
        <div class="pg-devices dv-tilt-inner" role="img" aria-label="Your website preview on a laptop and a phone">
          <div class="dv dv-laptop pg-laptop"><div class="dv-lid"><div class="dv-screen"><div class="dv-content" data-design="1280"></div></div></div><div class="dv-base"></div></div>
          <div class="dv dv-phone pg-phone"><div class="dv-screen"><div class="dv-content" data-design="390"></div></div><i class="dv-island"></i></div>
        </div>
        <p class="pg-status" aria-live="polite"></p>
      </div>

      <form class="pg-controls" aria-label="Design options">
        <fieldset class="pg-field">
          <legend class="pg-legend">Your business</legend>
          <div class="pg-chips" data-key="business"></div>
        </fieldset>
        <fieldset class="pg-field">
          <legend class="pg-legend">Mood</legend>
          <div class="pg-chips pg-moods" data-key="mood"></div>
        </fieldset>
        <fieldset class="pg-field">
          <legend class="pg-legend">Layout</legend>
          <div class="pg-chips pg-layouts" data-key="layout"></div>
        </fieldset>
        <div class="pg-field">
          <label class="pg-legend" for="pg-name">Your business name <span class="pg-optional">(optional)</span></label>
          <input class="pg-name" id="pg-name" type="text" maxlength="32" autocomplete="organization" placeholder="Type it and watch">
        </div>
        <div class="pg-actions">
          <button type="button" class="pg-send">Send this to Toff</button>
          <button type="button" class="pg-shuffle">Surprise me</button>
        </div>
        <p class="pg-sent" aria-live="polite"></p>
      </form>
    </div>
  </div>
</section>
