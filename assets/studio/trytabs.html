<!-- Try it: the four hands-on tools in one section, one at a time. Paste after Recent work.
     The four panels hold the playground, Draw your site, Your logo in one line and the features demos. -->
<section class="tt-section" id="try-it" aria-labelledby="tt-title">
  <div class="r3-section tt-head">
    <div class="r3-inner">
      <div class="r3-intro--split">
        <h2 class="r3-h2" id="tt-title">Try it with your own business</h2>
        <p class="r3-lede">Four things to play with. Nothing you do here is sent anywhere unless you choose to send it.</p>
      </div>
      <div class="tt-tabs" role="tablist" aria-label="What to try">
        <button type="button" role="tab" class="tt-tab" id="tt-tab-look" aria-controls="tt-look" data-tab="look">Pick a look</button>
        <button type="button" role="tab" class="tt-tab" id="tt-tab-sketch" aria-controls="tt-sketch" data-tab="sketch">Sketch your homepage</button>
        <button type="button" role="tab" class="tt-tab" id="tt-tab-logo" aria-controls="tt-logo" data-tab="logo">Your logo in one line</button>
        <button type="button" role="tab" class="tt-tab" id="tt-tab-features" aria-controls="tt-features" data-tab="features">Booking and other features</button>
      </div>
    </div>
  </div>
  <div class="tt-panel" role="tabpanel" id="tt-look" aria-labelledby="tt-tab-look" data-tab-panel="look">{LOOK}</div>
  <div class="tt-panel" role="tabpanel" id="tt-sketch" aria-labelledby="tt-tab-sketch" data-tab-panel="sketch" hidden>{SKETCH}</div>
  <div class="tt-panel" role="tabpanel" id="tt-logo" aria-labelledby="tt-tab-logo" data-tab-panel="logo" hidden>{LOGO}</div>
  <div class="tt-panel" role="tabpanel" id="tt-features" aria-labelledby="tt-tab-features" data-tab-panel="features" hidden>{FEATURES}</div>
</section>
